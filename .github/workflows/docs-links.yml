name: Validate documentation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check relative documentation links
        run: python3 scripts/check_links.py
      - name: Validate startup perks catalog
        run: python3 scripts/validate_perks.py
